services:
  - type: web
    name: salary-manager
    env: python
    buildCommand: curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="/root/.cargo/bin:$PATH" && cd backend && uv sync && uv run python -m app.seed.seed_employees
    startCommand: cd backend && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
